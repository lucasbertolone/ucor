<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Antonia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100%; height: 100vh;
            background: #000;
            font-family: 'Bodoni', monospace;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        #container { position: relative; width: 100%; height: 100%; }
        canvas { position: absolute; top: 0; left: 0; display: block; }
        
        .text-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100; text-align: center;
            pointer-events: none;
        }

        h1 {
            font-size: 8vw;
            color: #ffffff;
            letter-spacing: 15px;
            font-weight: bold;
            margin: 0;
            /* Aquí usamos las variables que controlaremos con JS */
            background: linear-gradient(var(--color1), var(--color2), var(--color3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: all 0.5s ease; /* Transición suave de color */
        }

        .subtitle { font-size: 1.3rem; color: #ffffff; margin-top: 20px; letter-spacing: 3px; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        <div class="text-container">
            <h1>AMO A ANTONIA</h1>
            <div class="subtitle">Pulsa "C" para cambiar el ambiente</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '@#*+=-:.'.split('');
        const charWidth = 10;
        const charHeight = 18;
        
        let cols = Math.floor(canvas.width / charWidth);
        let rows = Math.floor(canvas.height / charHeight);
        
        let time = 0;
        let speed = 0.015; 
        let indiceActual = 0;

        // Lista de gamas con sus colores de texto específicos
        const gamas = [
            { 
                nombre: "Todos", min: 0, max: 360, 
                texto: ["#FF0000", "#00FF00", "#0000FF"] 
            },
            { 
                nombre: "Rojos", min: 0, max: 40, 
                texto: ["#800000", "#FF4500", "#FFD700"] 
            },
            { 
                nombre: "Verdes", min: 80, max: 150, 
                texto: ["#006400", "#32CD32", "#ADFF2F"] 
            },
            { 
                nombre: "Azules", min: 180, max: 260, 
                texto: ["#00008B", "#00BFFF", "#00FFFF"] 
            },
            { 
                nombre: "Púrpuras", min: 280, max: 330, 
                texto: ["#4B0082", "#8A2BE2", "#FF00FF"] 
            }
        ];

        // Función para inyectar los colores del texto en el CSS
        function actualizarEstiloTexto() {
            const gama = gamas[indiceActual];
            const root = document.documentElement;
            root.style.setProperty('--color1', gama.texto[0]);
            root.style.setProperty('--color2', gama.texto[1]);
            root.style.setProperty('--color3', gama.texto[2]);
        }

        function getPlasmaValue(x, y, t) {
            let v = Math.sin((x * 0.01) + t);
            v += Math.sin((y * 0.01) + t);
            v += Math.sin((x + y) * 0.01 + t);
            v += Math.sin(Math.sqrt(x * x + y * y) * 0.02 + t);
            return (v + 4) / 8; 
        }

        function getColorFromValue(value) {
            const gama = gamas[indiceActual];
            const hue = gama.min + (value * (gama.max - gama.min));
            return `hsl(${hue}, 100%, 50%)`;
        }

        function getCharFromValue(value) {
            const index = Math.floor(value * (chars.length - 1));
            return chars[index] || '.';
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = charHeight + 'px Courier New';
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const x = col * charWidth;
                    const y = row * charHeight;
                    const plasmaValue = getPlasmaValue(col * 5, row * 5, time);
                    const char = getCharFromValue(plasmaValue);
                    const color = getColorFromValue(plasmaValue);

                    ctx.fillStyle = color;
                    ctx.fillText(char, x, y);
                }
            }
            time += speed;
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cols = Math.floor(canvas.width / charWidth);
            rows = Math.floor(canvas.height / charHeight);
        });

        document.addEventListener('click', () => {
            indiceActual = (indiceActual + 1) % gamas.length;
            actualizarEstiloTexto();
        });

        document.addEventListener('keydown', (event) => { 
           if (event.key.toLowerCase() === 'c') {
                indiceActual = (indiceActual + 1) % gamas.length;
                actualizarEstiloTexto(); // Llamamos a la función al cambiar tema
           }
        });

        // Inicio
        actualizarEstiloTexto();
        draw();
    </script>
</body>
</html>
