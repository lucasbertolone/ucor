<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCor - Crear Grupo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1 fs-2">🎓 UCor</span>
        </div>
    </nav>
    <div class="container" style="max-width: 500px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold">Crear un grupo 👥</h3>
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-bold">Nombre del grupo:</label>
                        <input type="text" name="nombre" class="form-control form-control-lg"
                               required placeholder="Ej: rancagua 4ever">
                        <div class="form-text">Se va a generar un código único para compartir con tus amigos.</div>
                    </div>
                    <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold">
                        Crear grupo
                    </button>
                </form>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="/" class="text-decoration-none text-muted">← Volver al inicio</a>
        </div>
    </div>
</body>
</html>
