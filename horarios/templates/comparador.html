<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCor - Comparador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    
    <script>
      // Esta es la magia de JavaScript que dibuja el calendario
      document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendario');
        
        // Tomamos el JSON que mandó Django
        var eventos = {{ eventos_json|safe }}; 

        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'timeGridWeek', // Vista semanal
          slotMinTime: '08:00:00',     // Ocultamos la madrugada (empieza a las 8 AM)
          slotMaxTime: '22:00:00',     // Termina a las 10 PM
          weekends: false,             // Ocultamos sábado y domingo
          allDaySlot: false,           // Quitamos la fila de "todo el día"
          events: eventos,             // ¡Cargamos los ramos!
          eventOverlap: true,          // PERMITIMOS SUPERPOSICIÓN (La clave de todo)
          slotEventOverlap: true,
          headerToolbar: false,        // Ocultamos los botones de cambiar mes/año
          dayHeaderFormat: { weekday: 'long' } // Muestra "Lunes", "Martes"...
        });
        
        calendar.render();
      });
    </script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1 fs-2">🎓 UCor - Comparador</span>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-md-3 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">👥 Selecciona amigos:</h5>
                        <form method="GET" action="">
                            <div class="mb-3">
                                {% for u in usuarios %}
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="amigos" value="{{ u.username }}" id="chk_{{ u.username }}" 
                                    {% if u.username in seleccionados %}checked{% endif %}>
                                    <label class="form-check-label fw-bold" for="chk_{{ u.username }}">
                                        {{ u.username }}
                                    </label>
                                </div>
                                {% endfor %}
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Comparar Horarios</button>
                        </form>
                        <hr>
                        <a href="/" class="btn btn-outline-secondary w-100">← Volver al inicio</a>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card shadow-sm border-0 p-3">
                    <div id='calendario'></div> 
                </div>
            </div>
        </div>
    </div>

</body>
</html>
