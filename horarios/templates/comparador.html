<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCor - Comparador Profesional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendario');
        var eventos = {{ eventos_json|safe }}; 

        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'timeGridWeek',
          locale: 'es',
          firstDay: 1, // Iniciar en Lunes
          slotMinTime: '08:00:00',
          slotMaxTime: '21:00:00',
          allDaySlot: false,
          height: 'auto',
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'timeGridWeek,timeGridDay'
          },
          buttonText: {
            today: 'Hoy',
            week: 'Semana',
            day: 'Día'
          },
          events: eventos,
          eventOverlap: true,
          slotEventOverlap: true,
          eventClick: function(info) {
            alert('Materia: ' + info.event.title + '\nSala: ' + info.event.extendedProps.sala);
          }
        });
        
        calendar.render();
      });
    </script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1 fs-2">🎓 UCor Coordinador</span>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h5 class="card-title fw-bold mb-3">Filtrar Amigos</h5>
                        <form method="GET">
                            {% for u in usuarios %}
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="amigos" value="{{ u.username }}" 
                                       id="u_{{ u.id }}" {% if u.username in seleccionados %}checked{% endif %}>
                                <label class="form-check-label" for="u_{{ u.id }}">
                                    {{ u.username }}
                                </label>
                            </div>
                            {% endfor %}
                            <button type="submit" class="btn btn-primary w-100 mt-3">Sincronizar Vista</button>
                        </form>
                    </div>
                </div>
                <a href="/" class="btn btn-outline-secondary w-100">Volver al inicio</a>
            </div>
            <div class="col-md-9">
                <div class="card shadow-sm border-0 p-3">
                    <div id='calendario'></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
