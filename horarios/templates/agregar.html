<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCor - Suma tu horario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1 fs-2">🎓 UCor</span>
        </div>
    </nav>
    <div class="container" style="max-width: 500px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold">Sincronizá tu horario 📅</h3>

                {% if error %}
                    <div class="alert alert-danger"><b>{{ error }}</b></div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tu nombre o alias:</label>
                        <input type="text" name="nombre" class="form-control form-control-lg"
                               required placeholder="Ej: Cristobal Leon">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Código del grupo:</label>
                        <input type="text" name="codigo_grupo" class="form-control form-control-lg text-center fw-bold"
                               required placeholder="UCO-XXXX"
                               value="{{ codigo_previo }}"
                               style="letter-spacing: 3px; text-transform: uppercase;">
                        <div class="form-text">Pide este código a quien creó el grupo.</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Link de tu horario (.ics):</label>
                        <input type="url" name="url_horario" class="form-control form-control-lg"
                               required placeholder="https://universidad.cl/horario.ics">
                        <div class="form-text">Horario → Configuración → Exportar → Copiar enlace</div>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm fw-bold">
                        Sincronizar mi horario
                    </button>
                </form>
            </div>
        </div>
        <div class="text-center mt-4 mb-5">
            <a href="/" class="text-decoration-none text-muted">← Volver al inicio</a>
        </div>
    </div>
</body>
</html>
